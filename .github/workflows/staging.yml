name: Pruebas (GitHub Pages)

# Cada push a main publica una copia de PRUEBAS en la URL gratuita de GitHub:
#   https://<usuario>.github.io/<repositorio>/
# No indexable por buscadores y con aviso "Entorno de pruebas". No toca producción.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Auditoría SEO (falla solo si hay errores)
        run: node .claude/skills/seo-audit/scripts/audit.mjs --fail-on-error

      - name: Construir versión de pruebas
        run: node scripts/build.mjs --target staging --base "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
